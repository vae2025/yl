<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>比价报告：充电宝</title>
  <style>
    :root {
      --bg: #0b0f16;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --warn: #f59e0b;
      --line: rgba(255,255,255,0.08);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans SC", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(34,197,94,0.10), transparent 50%), var(--bg);
      color: var(--text);
    }
    header {
      padding: 28px 28px 14px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.2px;
    }
    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }
    main {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      padding: 16px 28px 28px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .card .hd {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .card .hd .t {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      background: rgba(17,24,39,0.95);
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      z-index: 2;
    }
    td a {
      color: #93c5fd;
      text-decoration: none;
    }
    td a:hover {
      text-decoration: underline;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--text);
      margin-right: 6px;
      margin-bottom: 4px;
    }
    .pill.rec {
      border-color: rgba(34,197,94,0.40);
      background: rgba(34,197,94,0.12);
      color: #bbf7d0;
    }
    .pill.low {
      border-color: rgba(245,158,11,0.45);
      background: rgba(245,158,11,0.12);
      color: #fde68a;
    }
    #chart {
      width: 100%;
      height: 420px;
    }
    .side {
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .kpi {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 14px 14px;
    }
    .k {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px 12px;
      background: rgba(0,0,0,0.14);
    }
    .k .n {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .k .v {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .foot {
      padding: 10px 14px 14px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <header>
    <h1>比价报告：充电宝</h1>
    <div class="meta">items=5 recommended=3</div>
  </header>
  <main>
    <section class="card">
      <div class="hd">
        <div class="t">横向对比（价格从低到高）</div>
      </div>
      <div style="max-height: 520px; overflow: auto;">
        <table>
          <thead>
            <tr>
              <th>平台</th>
              <th>商品</th>
              <th>价格</th>
              <th>销量</th>
              <th>店铺评分</th>
              <th>标签</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <aside class="side">
      <section class="card">
        <div class="hd">
          <div class="t">概览</div>
        </div>
        <div class="kpi">
          <div class="k">
            <div class="n">最低价</div>
            <div class="v" id="kpiLowest">-</div>
          </div>
          <div class="k">
            <div class="n">候选数</div>
            <div class="v" id="kpiTotal">-</div>
          </div>
        </div>
        <div class="foot">提示：平台页面结构可能变化；采集失败时建议使用演示数据模式。</div>
      </section>
      <section class="card">
        <div class="hd">
          <div class="t">价格趋势（历史）</div>
        </div>
        <div id="chart"></div>
      </section>
    </aside>
  </main>

  <script>
    const data = {"keyword": "充电宝", "items": [{"id": "2a4b782879ee993d513caa64", "platform": "demo", "title": "Baseus 倍思 10000mAh 充电宝 20W 快充", "price": 59.9, "url": "https://example.com/demo/baseus-powerbank-10000", "currency": "CNY", "sales": 56000, "shop_rating": 4.7, "fetched_at": "2026-05-14T12:06:46.859067+00:00", "score": 0.27051774051403316, "tags": ["最低价", "推荐"]}, {"id": "032e682edae3a258a2606375", "platform": "demo", "title": "罗马仕 ROMOSS 20000mAh 充电宝 大容量 18W 快充", "price": 69.0, "url": "https://example.com/demo/romoss-powerbank-20000", "currency": "CNY", "sales": 74000, "shop_rating": 4.6, "fetched_at": "2026-05-14T12:06:46.859082+00:00", "score": 0.271047073501519, "tags": ["推荐"]}, {"id": "19c55a01ea04a2f1e26d5fa7", "platform": "demo", "title": "小米 20000mAh 充电宝 22.5W 快充 便携移动电源", "price": 79.0, "url": "https://example.com/demo/xiaomi-powerbank-20000", "currency": "CNY", "sales": 32000, "shop_rating": 4.8, "fetched_at": "2026-05-14T12:06:46.859036+00:00", "score": 0.26109650735547985, "tags": ["推荐"]}, {"id": "f6150f738e6b445dbf1feeb8", "platform": "demo", "title": "绿联 UGREEN 10000mAh 充电宝 30W 快充 口袋款", "price": 99.0, "url": "https://example.com/demo/ugreen-powerbank-10000", "currency": "CNY", "sales": 22000, "shop_rating": 4.8, "fetched_at": "2026-05-14T12:06:46.859075+00:00", "score": 0.2535584053635508, "tags": []}, {"id": "6ea89856d075a599fb1e48a0", "platform": "demo", "title": "Anker 安克 20000mAh 充电宝 PD 20W 双向快充", "price": 129.0, "url": "https://example.com/demo/anker-powerbank-20000", "currency": "CNY", "sales": 18000, "shop_rating": 4.9, "fetched_at": "2026-05-14T12:06:46.859055+00:00", "score": 0.2507866923517327, "tags": []}], "summary": {"total": 5, "lowestPrice": 59.9, "recommendedIds": ["032e682edae3a258a2606375", "2a4b782879ee993d513caa64", "19c55a01ea04a2f1e26d5fa7"]}, "trend": [{"productId": "2a4b782879ee993d513caa64", "title": "Baseus 倍思 10000mAh 充电宝 20W 快充", "points": [{"ts": "2026-05-14T12:06:46.859067+00:00", "value": 59.9}]}, {"productId": "032e682edae3a258a2606375", "title": "罗马仕 ROMOSS 20000mAh 充电宝 大容量 18W 快充", "points": [{"ts": "2026-05-14T12:06:46.859082+00:00", "value": 69.0}]}, {"productId": "19c55a01ea04a2f1e26d5fa7", "title": "小米 20000mAh 充电宝 22.5W 快充 便携移动电源", "points": [{"ts": "2026-05-14T12:06:46.859036+00:00", "value": 79.0}]}, {"productId": "f6150f738e6b445dbf1feeb8", "title": "绿联 UGREEN 10000mAh 充电宝 30W 快充 口袋款", "points": [{"ts": "2026-05-14T12:06:46.859075+00:00", "value": 99.0}]}, {"productId": "6ea89856d075a599fb1e48a0", "title": "Anker 安克 20000mAh 充电宝 PD 20W 双向快充", "points": [{"ts": "2026-05-14T12:06:46.859055+00:00", "value": 129.0}]}]};
    const tbody = document.getElementById('rows');
    document.getElementById('kpiTotal').textContent = data.summary.total;
    document.getElementById('kpiLowest').textContent = data.summary.lowestPrice == null ? '-' : '¥' + data.summary.lowestPrice.toFixed(2);

    for (const it of data.items) {
      const tr = document.createElement('tr');
      const title = document.createElement('a');
      title.href = it.url;
      title.target = '_blank';
      title.rel = 'noreferrer';
      title.textContent = it.title;
      const tagTd = document.createElement('td');
      for (const t of (it.tags || [])) {
        const s = document.createElement('span');
        s.className = 'pill ' + (t === '推荐' ? 'rec' : (t === '最低价' ? 'low' : ''));
        s.textContent = t;
        tagTd.appendChild(s);
      }
      tr.innerHTML = `
        <td>${it.platform}</td>
        <td></td>
        <td>¥${Number(it.price).toFixed(2)}</td>
        <td>${it.sales == null ? '-' : it.sales}</td>
        <td>${it.shop_rating == null ? '-' : it.shop_rating}</td>
      `;
      tr.children[1].appendChild(title);
      tr.appendChild(tagTd);
      tbody.appendChild(tr);
    }

    const el = document.getElementById('chart');
    const chart = echarts.init(el);
    const series = (data.trend || []).map(s => {
      return {
        name: s.title,
        type: 'line',
        showSymbol: false,
        smooth: true,
        data: (s.points || []).map(p => [p.ts, p.value]),
      };
    });
    chart.setOption({
      backgroundColor: 'transparent',
      textStyle: { color: '#e5e7eb' },
      tooltip: { trigger: 'axis' },
      legend: {
        type: 'scroll',
        textStyle: { color: '#9ca3af' },
      },
      grid: { left: 40, right: 20, top: 40, bottom: 30 },
      xAxis: {
        type: 'time',
        axisLabel: { color: '#9ca3af' },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } },
      },
      yAxis: {
        type: 'value',
        axisLabel: { color: '#9ca3af' },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } },
      },
      series,
    });
    window.addEventListener('resize', () => chart.resize());
  </script>
</body>
</html>
